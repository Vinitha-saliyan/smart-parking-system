name: smart_parking_user
description: AI Smart Parking System - User Application
publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0

  google_fonts: ^6.2.1
  flutter_animate: ^4.5.2
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  fl_chart: ^0.70.2
  intl: ^0.19.0
  flutter_svg: ^2.0.16
  shared_preferences: ^2.3.4
  web_socket_channel: ^3.0.2
  json_annotation: ^4.9.0
  uuid: ^4.5.1
  flutter_staggered_animations: ^1.1.1
  percent_indicator: ^4.2.3
  smooth_page_indicator: ^1.2.0+3

  # Razorpay Standard Checkout for Android and iOS.
  razorpay_flutter: 1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.3

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/icons/
    - assets/images/
