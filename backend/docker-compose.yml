version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: smart_parking_db
    environment:
      POSTGRES_DB: smart_parking
      POSTGRES_USER: parking_admin
      POSTGRES_PASSWORD: parking_secret_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U parking_admin -d smart_parking"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: smart_parking_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
